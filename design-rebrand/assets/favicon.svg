<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
<style>
/* Marchio Spicchi. Default: 1a (bianco e oro), la versione che usa il gioco.
   Solo su tab chiare passa a 1b (blu scuro e bianco), altrimenti l'oro sparirebbe. */
.a{stroke:#F5B63F}.b{stroke:#EDE9FF}.dot{fill:#F5B63F}
@media (prefers-color-scheme: light){.a{stroke:#141A3D}.b{stroke:#FFFDF6}.dot{fill:#141A3D}}
</style>
<g transform="rotate(-90 48 48)" fill="none" stroke-width="14">
<circle class="a" cx="48" cy="48" r="28" stroke-dasharray="21.99 21.99"/>
<circle class="b" cx="48" cy="48" r="28" stroke-dasharray="21.99 21.99" stroke-dashoffset="-21.99"/>
</g>
<circle class="dot" cx="48" cy="48" r="5"/>
</svg>
